# Every pull request from this repository: CI, then a preview at https://pr-N.<production host>,
# rebuilt on each push. Reviewers sign in with the same GitHub login as production. The preview
# is removed when the PR is merged or closed (preview-teardown.yml).
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push replaces a preview deploy still in progress.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Never for forks: a preview runs the PR's code with access to the cluster.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write # to post the preview's address
    env:
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_NAME: ${{ vars.AKS_NAME }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - uses: docker/setup-buildx-action@v3
      - name: deploy the preview
        run: deploy/scripts/preview.sh up "$PR" "${{ github.event.pull_request.head.sha }}"
      - name: post the address on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://pr-$PR.$PREVIEW_DOMAIN"
          body="**Preview:** $url
          Built from ${{ github.event.pull_request.head.sha }}. Sign in with GitHub as on production. It starts from a copy of production's data (no one's saved settings) and runs without background workflows. It is removed when this PR is merged or closed."
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "$body" --edit-last --create-if-none
