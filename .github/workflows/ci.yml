# Every pull request and every push to main: the tests, the web checks, and the deploy files
# checked. The deploy workflow calls this too, so it asks for no more than read access; the pull
# request `terraform plan`, which logs in to Azure, is its own workflow (plan.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # the deploy workflow runs these first

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gaffer
          POSTGRES_PASSWORD: gaffer
          POSTGRES_DB: gaffer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gaffer -d gaffer_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GAFFER_TEST_DSN: postgres://gaffer:gaffer@localhost:5432/gaffer_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "23.6"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - name: terraform fmt and validate
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: helm lint
        run: helm lint deploy/helm/gaffer --set host=ci.example --set acmeEmail=ci@example.com
      # Each platform chart checks our values against its schema, as deploy.sh will install them.
      - name: platform chart values
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests
          helm repo add temporal https://go.temporal.io/helm-charts
          helm template t traefik/traefik --version 42.1.3 -f deploy/helm/values-traefik.yaml >/dev/null
          helm template c jetstack/cert-manager --version v1.21.3 --set crds.enabled=true >/dev/null
          helm template o oauth2-proxy/oauth2-proxy --version 10.7.1 -f deploy/helm/values-oauth2-proxy.yaml \
            --set 'extraArgs.github-user=a\,b' --set extraArgs.redirect-url=https://ci.example/oauth2/callback >/dev/null
          helm template temporal temporal/temporal --version 1.7.0 -f deploy/helm/values-temporal.yaml \
            --set server.config.persistence.datastores.default.sql.connectAddr=db:5432 \
            --set server.config.persistence.datastores.visibility.sql.connectAddr=db:5432 >/dev/null
