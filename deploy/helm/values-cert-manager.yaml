# cert-manager (jetstack/cert-manager v1.21.3).
crds:
  enabled: true
resources:
  requests: { cpu: 10m, memory: 48Mi }
# The Datadog cert-manager integration reads the controller's metrics, which include when each
# certificate expires (an alert warns two weeks before). Ignored when Datadog is not installed.
podAnnotations:
  ad.datadoghq.com/cert-manager-controller.checks: |
    {"cert_manager": {"instances": [{"openmetrics_endpoint": "http://%%host%%:9402/metrics"}]}}
