# The public host name, e.g. letsgogaffer.tech. Set on install.
host: ""

# The address the app had before (its sslip.io name). Every request to it is redirected,
# permanently, to the same path on host, so links shared earlier keep working. Empty: none.
legacyHost: ""

# A pull request preview (deploy/scripts/preview.sh): web and API only, in its own namespace and
# database, with no background workflows, no certificate issuer and no login routes of its own (it
# uses production's login, whose cookie covers the preview's subdomain).
preview: false

# Where oauth2-proxy runs: production's namespace, also used by previews.
authNamespace: gaffer

# The owners' emails, comma-separated (GAFFER_OWNERS): only they may open the Temporal UI. Empty
# means nobody: the /temporal route is then not served at all.
ownerEmails: ""

# Where the API and the worker send traces and metrics (OpenTelemetry over HTTP): the Datadog
# Agent on the same node. Set by deploy.sh when Datadog is installed; empty sends nothing.
telemetry:
  otlpEndpoint: ""

image:
  registry: "" # e.g. gaffer1a2b3c.azurecr.io; set on install
  gaffer: gaffer
  web: gaffer-web
  tag: latest
  pullPolicy: IfNotPresent

# Settings that are not secret. Secrets (keys, DSN, FPL token, ntfy topic, team id) come from
# the existing gaffer-secrets Secret, made by deploy/scripts/bootstrap.sh from .env.
env:
  TEMPORAL_ADDRESS: temporal-frontend:7233
  GAFFER_NEWS_REFRESH: 30m
  GAFFER_EVAL_SCHEDULE: "0 3 * * *"
  TZ: America/New_York
  # Voyage requests a minute per pod. 300 needs a payment method on the Voyage account (standard
  # limits; the free tokens still apply). Without one Voyage allows 3: set this back to "3".
  VOYAGE_RPM: "300"

api:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 384Mi }
  autoscaling: { min: 1, max: 3, cpu: 70 }

worker:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 384Mi }
  autoscaling: { min: 1, max: 2, cpu: 70 }

web:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  autoscaling: { min: 1, max: 3, cpu: 70 }

# The first data load after install: the season, then the news (as a workflow).
initialLoad: true

# cert-manager issuer for the TLS certificate.
acmeEmail: ""
