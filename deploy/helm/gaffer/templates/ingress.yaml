{{- $host := .Values.host -}}
# The headers that name the signed-in user are removed from whatever the browser sends, before
# the login check sets them: otherwise a user without an email from GitHub could send someone
# else's and be served as them.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-identity
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
---
# Everything except /oauth2 passes the GitHub login first: Traefik asks oauth2-proxy about each
# request (forwardAuth), and only a signed-in, allowed user gets through.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-login
spec:
  forwardAuth:
    address: http://oauth2-proxy.{{ .Values.authNamespace }}.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders: ["X-Auth-Request-User", "X-Auth-Request-Email"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaffer
  labels:
    {{- include "gaffer.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # In order: drop any identity headers the browser sent, then check the login.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-strip-identity@kubernetescrd,{{ .Release.Namespace }}-github-login@kubernetescrd
spec:
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: gaffer-tls
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gaffer-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: gaffer-web, port: { number: 80 } } }
{{- if not .Values.preview }}
---
# The signed-out page, the privacy policy and terms, and the static files they need, are outside
# the login: landing anywhere
# else after signing out sends someone still logged in to GitHub straight back in. Nothing here
# reads data; the API stays behind the login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaffer-public
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: gaffer-tls
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /signed-out
            pathType: Exact
            backend: { service: { name: gaffer-web, port: { number: 80 } } }
          # The privacy policy and terms must be readable before signing in (Google links to them).
          - path: /privacy
            pathType: Exact
            backend: { service: { name: gaffer-web, port: { number: 80 } } }
          - path: /terms
            pathType: Exact
            backend: { service: { name: gaffer-web, port: { number: 80 } } }
          - path: /_next/static
            pathType: Prefix
            backend: { service: { name: gaffer-web, port: { number: 80 } } }
          # The sign-in hub's pages (the choice of GitHub or email/Google, and its callbacks).
          - path: /dex
            pathType: Prefix
            backend: { service: { name: dex, port: { number: 5556 } } }
---
# The login itself is not behind the login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaffer-oauth2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: gaffer-tls
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend: { service: { name: oauth2-proxy, port: { number: 80 } } }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ required "set acmeEmail for Let's Encrypt" .Values.acmeEmail | quote }}
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- end }}
{{- if and (not .Values.preview) (trim .Values.ownerEmails) }}
---
# The Temporal UI shows every workflow and its data, so only the owners may open it: after the
# usual sign-in, oauth2-proxy is asked once more, this time with the owners' emails, and anyone
# else gets 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: owners-only
spec:
  forwardAuth:
    address: http://oauth2-proxy.{{ .Values.authNamespace }}.svc.cluster.local/oauth2/auth?allowed_emails={{ .Values.ownerEmails | nospace | lower | urlquery }}
    trustForwardHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaffer-temporal
  labels:
    {{- include "gaffer.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-strip-identity@kubernetescrd,{{ .Release.Namespace }}-github-login@kubernetescrd,{{ .Release.Namespace }}-owners-only@kubernetescrd
spec:
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: gaffer-tls
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /temporal
            pathType: Prefix
            backend: { service: { name: temporal-web, port: { number: 8080 } } }
{{- end }}
{{- if and (not .Values.preview) (trim .Values.legacyHost) }}
---
# The old address answers every request with a permanent redirect to the same path on the new one.
# It needs its own certificate: the browser checks it before it ever sees the redirect.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: legacy-redirect
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)
    replacement: https://{{ $host }}${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaffer-legacy
  labels:
    {{- include "gaffer.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-legacy-redirect@kubernetescrd
spec:
  tls:
    - hosts: [{{ .Values.legacyHost | quote }}]
      secretName: gaffer-legacy-tls
  rules:
    - host: {{ .Values.legacyHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gaffer-web, port: { number: 80 } } }
{{- end }}
