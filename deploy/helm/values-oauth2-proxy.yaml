# oauth2-proxy (oauth2-proxy/oauth2-proxy 10.7.1): GitHub login in front of everything.
# Credentials come from the oauth2-proxy-secrets Secret (client-id, client-secret, cookie-secret),
# made by deploy/scripts/bootstrap.sh from the GitHub OAuth app. The allowed user and the redirect
# URL are set with --set on install.
config:
  existingSecret: oauth2-proxy-secrets
extraArgs:
  provider: github
  email-domain: "*"
  # Traefik's forwardAuth asks oauth2-proxy about each request: 202 means signed in, anything
  # else (a redirect to GitHub) is sent to the browser as is.
  reverse-proxy: true
  upstream: static://202
  skip-provider-button: true
  set-xauthrequest: true
  cookie-secure: true
  cookie-samesite: lax
resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }
