# Added to values-traefik.yaml by deploy.sh when the Datadog Agent is installed: Traefik starts the
# trace for each request and sends its span to the agent; the API's spans continue the same trace
# through the traceparent header.
tracing:
  serviceName: traefik
  # Datadog files spans by env; without this Traefik's arrive as env:none, apart from the app's.
  resourceAttributes:
    deployment.environment: prod
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: http://datadog.datadog.svc.cluster.local:4318/v1/traces
