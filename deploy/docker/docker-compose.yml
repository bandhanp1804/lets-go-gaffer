# Explicit name: otherwise compose uses the folder name ("docker"), and the
# volume would collide with any other project that lives in a folder called docker.
name: lets-go-gaffer

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gaffer
      POSTGRES_PASSWORD: gaffer
      POSTGRES_DB: gaffer
    ports:
      # Host port 5433: a native Postgres commonly owns 5432 on dev machines.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaffer -d gaffer"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Temporal's single-binary dev server, for the background workflows (`gaffer worker`).
  # gRPC on 7233, Web UI on http://localhost:8233. Its state lives in a SQLite file on a volume,
  # mounted on the image user's home so that user (uid 1000, not root) can write it.
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporaldata:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  temporaldata:
